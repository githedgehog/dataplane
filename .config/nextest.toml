# This is the default config used by nextest. It is embedded in the binary at
# build time. It may be used as a template for .config/nextest.toml.

[store]
# The directory under the workspace root at which nextest-related files are
# written. Profile-specific storage is currently written to dir/<profile-name>.
dir = "target/nextest"

# This section defines the default nextest profile. Custom profiles are layered
# on top of the default profile.
[profile.default]
# The set of tests run by `cargo nextest run` by default.
default-filter = "all()"

# "retries" defines the number of times a test should be retried. If set to a
# non-zero value, tests that succeed on a subsequent attempt will be marked as
# flaky. Can be overridden through the `--retries` option.
# Examples
# * retries = 3
# * retries = { backoff = "fixed", count = 2, delay = "1s" }
# * retries = { backoff = "exponential", count = 10, delay = "1s", jitter = true, max-delay = "10s" }
retries = 0

# The number of threads to run tests with. Supported values are either an integer or
# the string "num-cpus". Can be overridden through the `--test-threads` option.
test-threads = "num-cpus"

# The number of threads required for each test. This is generally used in overrides to
# mark certain tests as heavier than others. However, it can also be set as a global parameter.
threads-required = 1

# Extra arguments to pass in to the test binary at runtime. Intended primarily for
# communication with custom test harnesses -- use with caution!
run-extra-args = []

# Show these test statuses in the output.
#
# The possible values this can take are:
# * none: no output
# * fail: show failed (including exec-failed) tests
# * retry: show flaky and retried tests
# * slow: show slow tests
# * pass: show passed tests
# * skip: show skipped tests (most useful for CI)
# * all: all of the above
#
# Each value includes all the values above it; for example, "slow" includes
# failed and retried tests.
#
# Can be overridden through the `--status-level` flag.
status-level = "pass"

# Similar to status-level, show these test statuses at the end of the run.
final-status-level = "slow"

# "failure-output" defines when standard output and standard error for failing tests are produced.
# Accepted values are
# * "immediate": output failures as soon as they happen
# * "final": output failures at the end of the test run
# * "immediate-final": output failures as soon as they happen and at the end of
#   the test run; combination of "immediate" and "final"
# * "never": don't output failures at all
#
# For large test suites and CI it is generally useful to use "immediate-final".
#
# Can be overridden through the `--failure-output` option.
failure-output = "immediate"

# "success-output" controls production of standard output and standard error on success. This should
# generally be set to "never".
success-output = "never"

# Cancel the test run on the first failure. For CI runs, consider setting this
# to false.
# Accepted values are
# * true: cancel the test run on the first failure
# * false: continue running tests even after a failure
# * { max-fail = 10 }: cancel the test run after the specified number of failures
# * { max-fail = "all" }: continue running tests even after a failure
fail-fast = false

# Treat a test that takes longer than the configured 'period' as slow, and print a message.
# See <https://nexte.st/docs/features/slow-tests> for more information.
#
# Optional: specify the parameter 'terminate-after' with a non-zero integer,
# which will cause slow tests to be terminated after the specified number of
# periods have passed.
# Example: slow-timeout = { period = "60s", terminate-after = 2 }
slow-timeout = { period = "60s" }

# Treat a test as leaky if after the process is shut down, standard output and standard error
# aren't closed within this duration.
#
# This usually happens in case of a test that creates a child process and lets it inherit those
# handles, but doesn't clean the child process up (especially when it fails).
#
# See <https://nexte.st/docs/features/leaky-tests> for more information.
leak-timeout = "500ms"

# `nextest archive` automatically includes any build output required by a standard build.
# However sometimes extra non-standard files are required.
# To address this, "archive.include" specifies additional paths that will be included in the archive.
archive.include = [
	# Examples:
	#
	# { path = "application-data", relative-to = "target" },
	# { path = "data-from-some-dependency/file.txt", relative-to = "target" },
	#
	# In the above example:
	# * the directory and its contents at "target/application-data" will be included recursively in the archive.
	# * the file "target/data-from-some-dependency/file.txt" will be included in the archive.
]

[profile.default.junit]
# Output a JUnit report into the given file inside 'store.dir/<profile-name>'.
# If unspecified, JUnit is not written out.
path = "junit.xml"

# The name of the top-level "report" element in JUnit report. If aggregating
# reports across different test runs, it may be useful to provide separate names
# for each report.
report-name = "Hedgehog Dataplane Tests"

# Whether standard output and standard error for passing tests should be stored in the JUnit report.
# Output is stored in the <system-out> and <system-err> elements of the <testcase> element.
store-success-output = true

# Whether standard output and standard error for failing tests should be stored in the JUnit report.
# Output is stored in the <system-out> and <system-err> elements of the <testcase> element.
#
# Note that if a description can be extracted from the output, it is always stored in the
# <description> element.
store-failure-output = true

# [[profile.default.overrides]]
# filter = 'test(flaky test name here)'
# retries = 3

# Every package that boots a guest, not just the one that owns the harness.
#
# A VM claims a 1GiB hugepage for its guest memory and the host pool is small -- two pages on the
# machine this was found on. Nothing arbitrates that pool, so tests that boot concurrently race for
# it and the losers fail with "the 1073741824-byte hugepage pool has 0 free page(s)". That is a
# resource conflict wearing the costume of a flaky test, and it made ten of `dataplane-n-vm`'s
# eighteen integration tests fail in a whole-workspace run while all eighteen passed with
# `--test-threads 1`.
#
# The list is `#[n_vm::test]`'s users. It has to be maintained by hand, which is the weakness of
# fixing this here: a package that starts booting guests and is not added to it fails in a way that
# looks like its own bug. The durable fix is for `n-vm` to acquire the pool itself and wait rather
# than fail -- a test harness that only works when the consuming repo's runner config is right is
# not one that can be handed to another repo.
[[profile.default.overrides]]
filter = '''
    package(dataplane)
  + package(dataplane-n-vm)
  + package(dataplane-n-it)
  + package(dataplane-hardware)
  + package(dataplane-interface-manager)
  + package(dataplane-mgmt)
'''
platform = 'cfg(unix)'
test-group = 'vm'

# The generated properties in `packet_processor::fuzz`, which assert on how much they covered.
#
# bolero ends a property at whichever comes first, its iteration count or its wall-clock budget,
# and that budget defaults to one second. A property that is only searching is fine with a small
# sample -- it just searches less. These are not only searching: each one ends in `assert_covered`
# calls that fail if some branch was never reached, so for them the sample size *is* the test.
#
# 620 tests in this workspace run on that one-second budget, 347 of them in `dataplane-net`, and
# each is CPU-bound for the whole second. Packed together they starve each other.
# `every_shape_leaves_the_pipeline_with_a_verdict` got 2 cases at 1.90 iterations/s in CI and
# failed with `NoIp=0`. Neither the pipeline nor the guard was wrong -- the test got about a
# fifteenth of a core.
#
# Reproduced and measured by pinning nextest to ten CPUs while it runs 32 threads, which is the
# shape of the CI runner's cgroup, over `package(dataplane-net) + test(shapes::every_shape_leaves)`:
#
#     without this override   3.51 iterations/s    4 cases    NoIp  7
#     with it                   18 iterations/s   20 cases    NoIp 36
#     the test on its own        29 iterations/s   29 cases    NoIp 55
#
# Four cases is a coin toss on whether a shape appears at all, which is how this reaches CI as an
# intermittent failure in a test that has nothing intermittent about it.
#
# `threads-required` is the fix rather than a longer budget or a guard that stands down when its
# sample is small. A longer budget multiplies the cost of all 620 tests to help these 24, and a
# guard that gives up when starved stops guarding on exactly the slow and varied machines nobody
# here can measure. Reserving the thread budget costs the ~26 test-seconds this module takes.
#
# It is scoped to the module and not to the 24 test names so that a property added beside them
# inherits it; the price of that is a cheap test added here also getting the machine to itself.
[[profile.default.overrides]]
filter = 'package(dataplane) & test(packet_processor::fuzz::)'
threads-required = "num-test-threads"

[test-groups]
vm = { max-threads = 1 }

# For chasing a hang, where the question is *which* tests wedge rather than what they report.
#
# Both bounds are deliberately impatient. `slow-timeout` reaps a test after 10s so that one hang
# stops hiding every test queued behind it -- the default profile has no `terminate-after` at all,
# so a single wedged test blocks the run until you notice, and `cross-qemu`'s 60s x 5 still costs
# five minutes per hang. `global-timeout` then caps the whole run, because a suite of hangs
# otherwise outlasts anyone's patience.
#
# Not for judging results: 10s will reap a legitimately slow test, and several of the model-checked
# properties take longer than that when they are working. Use it to get the list, then re-run the
# named test on a profile that gives it room.
[profile.scratch]
slow-timeout = { period = "10s", terminate-after = 1 }
global-timeout = "300s"
fail-fast = false
final-status-level = "all"

[profile.miri]
slow-timeout = { period = "500s" }

[profile.cross-qemu]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
failure-output = "immediate-final"
