[package]
name = "dataplane-hardware"
description = "hardware scan and report library"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# Enables property testing / fuzzing support for testing.
bolero = ["dep:bolero"]
# Enables hardware topology scanning using the `hwlocality` crate.
scan = ["dep:hwlocality", "dep:pci-ids"]
# Adds serialization support for all types using serde.
serde = ["dep:serde", "id/serde"]

[dependencies]
# internal
id = { workspace = true, features = ["rkyv"] }

# external
bolero = { workspace = true, optional = true, features = ["alloc"] }
bytecheck = { workspace = true }
hwlocality = { workspace = true, optional = true, features = ["hwloc-latest"] }
num-derive = { workspace = true, features = [] }
num-traits = { workspace = true, features = [] }
pci-ids = { workspace = true, optional = true, features = [] }
rkyv = { workspace = true, features = ["std", "default"] }
serde = { workspace = true, optional = true, features = ["std"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
sysfs = { workspace = true }
# `netns` needs setns/unshare (`sched`) and the fresh sysfs mount (`mount`).
nix = { workspace = true, features = ["sched", "mount"] }

[dev-dependencies]
# internal
# `tests/dpdk_in_vm.rs` drives a real DPDK device inside a guest and parses
# what comes back off the wire; neither is needed by the library itself.
dpdk = { workspace = true, features = [] }
net = { workspace = true, features = [] }
# `tests/dpdk_pipeline_on_nic.rs` runs the real network-function pipeline over
# mbufs received from a physical port.
pipeline = { workspace = true, features = [] }
fixin = { workspace = true, features = [] }
id = { workspace = true, features = ["serde", "rkyv"] }
n-vm = { workspace = true }
test-utils = { workspace = true, features = [] }

# external
bolero = { workspace = true, features = ["alloc"] }
hwlocality = { workspace = true, features = ["hwloc-latest"] }
pci-ids = { workspace = true, features = [] }
serde = { workspace = true, features = ["std"] }
serde_yaml_ng = { workspace = true, features = [] }
nix = { workspace = true, features = ["sched", "mount"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
dpdk-sysroot-helper = { workspace = true }

# `tests/dpdk_in_vm.rs` gates its 1 GiB-host-page variants on this; declared
# per package because cargo's `[lints]` are, and the n-vm crate's own
# declaration does not reach here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(host_hugepage_tests)', 'cfg(nic_loopback_tests)', 'cfg(netns_tests)'] }
