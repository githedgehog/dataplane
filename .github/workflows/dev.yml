# The primary point of this workflow is to ensure that the developer experience is good.
# We take a very vanilla ubuntu image, install all necessary dependencies via "normal" means,
# and then run the build and test steps as described in the README.md file.

# The artifacts produced by these builds are not intended to be used for anything other than
# ensuring that the developer experience is good.

# Production artifacts are produced via nix builds (in another CI workflow).

name: "dev.yml"

on:
  pull_request:
    # Removing a label must recompute the plan just as adding one does.
    types: ["opened", "synchronize", "reopened", "labeled", "unlabeled"]
  push:
    branches:
      - "main"
      - "release/v*"
    tags:
      - "v*"
  merge_group:
    types: ["checks_requested"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: "boolean"
        description: "Run with tmate enabled"
        required: false
        default: false
      debug_justfile:
        type: "boolean"
        description: "enable to see debug statements from just recipes"
        required: false
        default: false
      skip_vlab_tests:
        type: "boolean"
        description: "Skip VLAB tests (they run by default)"
        required: false
        default: false
      run_hlab_tests:
        type: "boolean"
        description: "Run hybrid HLAB tests"
        required: false
        default: false
      enable_release_tests:
        type: "boolean"
        description: "Enable release tests for VLAB/HLAB tests"
        required: false
        default: false

concurrency:
  group: "${{ github.workflow }}:${{ github.event.pull_request.number || github.event.after || github.event.merge_group && github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: "read"

env:
  CI_DEBUG_JUSTFILE: "${{ github.event_name == 'workflow_dispatch' && inputs.debug_justfile || false }}"

jobs:
  plan:
    name: "Plan which jobs to run"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    outputs:
      container_profiles: "${{ steps.container-profiles.outputs.value }}"
      parallel: "${{ steps.parallel.outputs.value }}"
      profiles: "${{ steps.profiles.outputs.value }}"
      concurrency: "${{ steps.concurrency.outputs.value }}"
      cross: "${{ steps.cross.outputs.value }}"
      cross_full: "${{ steps.cross-full.outputs.value }}"
      miri: "${{ steps.miri.outputs.value }}"
      sanitize: "${{ steps.sanitize.outputs.value }}"
      test_each: "${{ steps.test-each.outputs.value }}"
      wasm: "${{ steps.wasm.outputs.value }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: "false"

      # Let merge-gating runs finish quickly without allowing pull requests to
      # crowd them out. `strategy` cannot read `env`, so expose this via `plan`.
      - id: "parallel"
        env:
          EVENT: "${{ github.event_name }}"
        run: |
          set -euo pipefail
          case "${EVENT}" in
            merge_group | push) value="4" ;;
            *) value="1" ;;
          esac
          printf 'value=%s\n' "${value}" >>"${GITHUB_OUTPUT}"

      - id: "miri"
        uses: &gate "./.github/actions/ci-gate"
        with:
          labels: "miri"

      - id: "sanitize"
        uses: *gate
        with:
          labels: "sanitize"

      - id: "cross"
        uses: *gate
        with:
          labels: "cross cross/full"

      - id: "cross-full"
        uses: *gate
        with:
          labels: "cross/full"

      - id: "concurrency"
        uses: *gate
        with:
          labels: "concurrency"

      - id: "test-each"
        uses: *gate
        with:
          labels: "test-each"

      - id: "profiles"
        uses: *gate
        with:
          labels: "test/all-profiles"
          on-value: '["debug", "release", "fuzz"]'
          off-value: '["debug"]'

      # Lab jobs require release images but not other release/fuzz checks.
      - id: "container-profiles"
        uses: *gate
        with:
          labels: "test/all-profiles"
          # The build matrix has no fuzz container targets.
          on-value: '["debug", "release"]'
          # Pull-request lab labels require both debug and release images.
          off-value: >-
            ${{
              github.event_name == 'pull_request'
              && (
                contains(github.event.pull_request.labels.*.name, 'ci:+vlab')
                || contains(github.event.pull_request.labels.*.name, 'ci:+hlab')
              )
              && '["debug", "release"]'
              || '["debug"]'
            }}

      - id: "wasm"
        uses: *gate
        with:
          # Cross waits for WASM to limit runner load.
          labels: "wasm cross cross/full"

  version:
    name: "Generate temp artifact version"
    runs-on: lab

    permissions:
      contents: read

    outputs:
      version: "${{ steps.version-gen.outputs.version }}"
      ref: "${{ steps.version-gen.outputs.ref }}"

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate temp artifacts version
        id: version-gen
        env:
          commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "version=v0-${commit_sha::9}" >> "$GITHUB_OUTPUT"
          echo "ref=${commit_sha}" >> "$GITHUB_OUTPUT"

  check:
    name: "check/${{ matrix.profile }}"
    runs-on: "lab"
    needs:
      - plan
    permissions: &check-perms
      contents: "read"
    env: &ci-env
      USER: "runner"
      # The `just` action runs under `set -u`, so this stays defined.
      JUST_VARS: ""
    strategy:
      fail-fast: false
      # Each entry gets its own runner; this limits shared-pool occupancy.
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        profile: "${{ fromJSON(needs.plan.outputs.profiles) }}"
        exclude:
          # Fuzz repeats the release compile here; coverage, sanitizers, and
          # fuzzing jobs already exercise that profile.
          - profile: "fuzz"
    steps:
      - *checkout

      - &nix-setup
        uses: "./.github/actions/nix-setup"
        with:
          cachix_signing_key: "${{ secrets.CACHIX_SIGNING_KEY }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "fmt"
        uses: &just "./.github/actions/just"
        with:
          recipe: "ci::check-fmt"

      - name: "clippy"
        uses: *just
        with:
          recipe: "ci::check-clippy"
          recipe_args: "${{ matrix.profile }}"

      - name: "test"
        uses: *just
        with:
          recipe: "ci::check-test"
          recipe_args: "${{ matrix.profile }}"

      - name: "doctest"
        uses: *just
        with:
          recipe: "ci::check-doctest"
          recipe_args: "${{ matrix.profile }}"

      # Build API docs so links and cfg declarations cannot rot unnoticed.
      - name: "docs"
        uses: *just
        with:
          recipe: "ci::check-docs"
          recipe_args: "${{ matrix.profile }}"

      - &verify-clean-tree
        name: "verify-clean-tree"
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error:: Building the project left the tree dirty."
            echo "----- git status --porcelain -----"
            git status --porcelain
            echo "----- git diff -----"
            git diff
            echo "----- hint -----"
            echo "If the diff is on Cargo.lock, run a build locally and commit the updated lock file."
            exit 1
          fi

      - &tmate
        name: "Setup tmate session for debug"
        if: "${{ failure() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}"
        uses: "mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113" # v3.24
        timeout-minutes: 60
        with:
          limit-access-to-actor: true

  lint:
    name: "lint"
    runs-on: "lab"
    permissions:
      contents: "read"
    env:
      USER: "runner"
      JUST_VARS: "" # the `.github/actions/just` composite action runs under `set -u`; must be set even when empty
    steps:
      - *checkout
      - *nix-setup

      # `build` (and therefore `publish`, which pushes to our container
      # registry) depends on this whole job, so a check-dependencies failure
      # here still blocks a container push -- it's just no longer a separate,
      # uncoupled workflow that could pass or get skipped independently.
      #
      # These would be good candidates for the new `parallel:` step keyword
      # (none are compute-heavy or depend on each other), but actionlint
      # (which we also run here) doesn't understand that syntax yet -- see
      # https://github.com/rhysd/actionlint/issues/693. Revisit once it does.
      #
      # Each step is `continue-on-error` so one failing lint doesn't hide the
      # rest; "Flag any lint failures" below fails the job if any of them did.
      - name: "check-dependencies"
        id: "check-dependencies"
        continue-on-error: true
        uses: *just
        with:
          recipe: "check-dependencies"
          recipe_args: ""

      - name: "commitlint"
        id: "commitlint"
        continue-on-error: true
        uses: *just
        with:
          recipe: "commitlint"
          recipe_args: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}"

      - name: "opengrep"
        id: "opengrep"
        continue-on-error: true
        uses: *just
        with:
          recipe: "opengrep"

      - name: "zizmor"
        id: "zizmor"
        continue-on-error: true
        uses: *just
        with:
          recipe: "zizmor"
          recipe_args: "--color=never"

      - name: "pinact"
        id: "pinact"
        continue-on-error: true
        uses: *just
        with:
          recipe: "pinact"
          recipe_args: "--check --verify"

      - name: "actionlint"
        id: "actionlint"
        continue-on-error: true
        uses: *just
        with:
          recipe: "actionlint"

      - name: "markdownlint"
        id: "markdownlint"
        continue-on-error: true
        uses: *just
        with:
          recipe: "markdownlint"

      - name: "nixfmt"
        id: "nixfmt"
        continue-on-error: true
        uses: *just
        with:
          recipe: "nixfmt"

      - name: "check-lint-wiring"
        id: "check-lint-wiring"
        continue-on-error: true
        uses: *just
        with:
          recipe: "check-lint-wiring"

      - name: "check-push-filter"
        id: "check-push-filter"
        continue-on-error: true
        uses: *just
        with:
          recipe: "check-push-filter"

      # Cache misses still pass, so guard dependency reuse explicitly.
      - name: "check-deps-reuse"
        id: "check-deps-reuse"
        continue-on-error: true
        uses: *just
        with:
          recipe: "check-deps-reuse"

      - name: "license-headers"
        id: "license-headers"
        continue-on-error: true
        uses: *just
        with:
          recipe: "license-headers"

      - name: "Flag any lint failures"
        if: always()
        env:
          OUTCOMES: |-
            check-dependencies=${{ steps.check-dependencies.outcome }}
            commitlint=${{ steps.commitlint.outcome }}
            opengrep=${{ steps.opengrep.outcome }}
            zizmor=${{ steps.zizmor.outcome }}
            pinact=${{ steps.pinact.outcome }}
            actionlint=${{ steps.actionlint.outcome }}
            markdownlint=${{ steps.markdownlint.outcome }}
            nixfmt=${{ steps.nixfmt.outcome }}
            check-lint-wiring=${{ steps.check-lint-wiring.outcome }}
            check-push-filter=${{ steps.check-push-filter.outcome }}
            check-deps-reuse=${{ steps.check-deps-reuse.outcome }}
            license-headers=${{ steps.license-headers.outcome }}
        run: |
          set -euo pipefail
          status=0
          while IFS='=' read -r name outcome; do
            [ -z "${name}" ] && continue
            if [ "${outcome}" != "success" ] && [ "${outcome}" != "skipped" ]; then
              echo "::error::${name} failed (outcome=${outcome})"
              status=1
            fi
          done <<<"${OUTCOMES}"
          exit "${status}"

      - *tmate

  build:
    name: "${{ matrix.nix-target }}/${{ matrix.profile }}"
    runs-on: lab
    needs:
      - plan
      - version
      - lint
    permissions:
      contents: "read"
      packages: "write" # nix-setup logs into ghcr.io; this job pushes images via `just push-container`
    env: *ci-env
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        nix-target:
          - frr.dataplane
          - dataplane
          # Must match the build that produced the core.
          - dataplane-core-viewer
          # Live debugging of the same build, driven from an editor over DAP.
          - dataplane-dev-debugger
          # Syscall trace of the same build, as JSON.
          - dataplane-syscall-tracer
          - validator
        # TODO: enable cfi and safe-stack on release when possible
        profile: "${{ fromJSON(needs.plan.outputs.container_profiles) }}"
        exclude:
          - nix-target: validator
            profile: debug
    steps:
      - *checkout
      - *nix-setup

      - name: "push container"
        uses: *just
        with:
          recipe: "ci::push-container"
          recipe_args: "${{ matrix.nix-target }} ${{ matrix.profile }} ${{ needs.version.outputs.version }}"
      - *verify-clean-tree
      - *tmate

  sanitize:
    if: "${{ needs.plan.outputs.sanitize == 'true' }}"
    name: "sanitize/${{ matrix.sanitizer }}"
    runs-on: "lab"
    needs:
      - plan
      - check
    permissions: *check-perms
    env: *ci-env
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        sanitizer:
          - thread
          - address
    steps:
      - *checkout
      - *nix-setup
      - name: "test"
        uses: *just
        with:
          recipe: "ci::sanitize"
          recipe_args: "${{ matrix.sanitizer }}"
      - *tmate

  test_each:
    if: "${{ needs.plan.outputs.test_each == 'true' }}"
    name: "test_each"
    runs-on: "lab"
    needs:
      - plan
      - check
    permissions: *check-perms
    env: *ci-env
    steps:
      - *checkout
      - *nix-setup
      - name: "test-each"
        uses: *just
        with:
          recipe: "ci::test-each"
      - *tmate

  coverage:
    name: "coverage/${{ matrix.profile }}"
    runs-on: "lab"
    # Start baseline coverage immediately; deep jobs wait for cheap checks first.
    needs:
      - plan
    permissions:
      contents: "read"
      id-token: "write" # codecov-action authenticates by OIDC, not a stored token
    env: *ci-env
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      # Fuzz provides optimized coverage while retaining safety checks.
      matrix:
        profile: "${{ fromJSON(needs.plan.outputs.profiles) }}"
        exclude:
          - profile: release
    steps:
      - *checkout
      - *nix-setup

      - name: "coverage-archive"
        uses: *just
        with:
          recipe: "ci::coverage"
          recipe_args: "${{ matrix.profile }}"

      # Preserve partial results and keep profiles separate in Codecov.
      - name: "upload coverage to codecov"
        if: "${{ always() }}"
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
        with:
          files: "./target/coverage/lcov.info"
          report_type: "coverage"
          flags: "${{ matrix.profile }}"
          disable_search: "true"
          fail_ci_if_error: "false"
          use_oidc: "true"
          verbose: "true"

      - name: "upload test results to codecov"
        if: "${{ always() }}"
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
        with:
          files: "./target/nextest/default/junit.xml"
          report_type: "test_results"
          flags: "${{ matrix.profile }}"
          disable_search: "true"
          fail_ci_if_error: "false"
          use_oidc: "true"
          verbose: "true"

      # Publish branch coverage, which Codecov does not render.
      - name: "pack coverage reports"
        if: "${{ always() }}"
        env:
          PROFILE: "${{ matrix.profile }}"
        run: |
          set -euo pipefail
          declare -r out="./target/coverage"
          # gzip, not zstd: this step runs outside the nix shell.
          if [ -d "${out}/html" ]; then
            tar -C "${out}" -czf "${out}/coverage-html-${PROFILE}.tar.gz" html
          else
            echo "::warning::no HTML report to pack"
          fi
          # The artifact name is the file name, so qualify it by profile.
          if [ -r "${out}/lcov.info" ]; then
            cp -- "${out}/lcov.info" "${out}/lcov-${PROFILE}.info"
          else
            echo "::warning::no LCOV report to publish"
          fi

      # Avoid wrapping the reports in another archive.
      - name: "upload html coverage report"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          path: "./target/coverage/coverage-html-${{ matrix.profile }}.tar.gz"
          archive: "false"
          if-no-files-found: "warn"
          retention-days: "7"

      - name: "upload lcov coverage report"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          path: "./target/coverage/lcov-${{ matrix.profile }}.info"
          archive: "false"
          if-no-files-found: "warn"
          retention-days: "7"

      - name: "discard coverage intermediates"
        if: "${{ always() }}"
        run: |
          set -euo pipefail
          rm -rf ./target/coverage/extract ./target/coverage/profraw

      - *tmate

  miri:
    if: "${{ needs.plan.outputs.miri == 'true' }}"
    name: "check/miri/${{ matrix.cpu }}"
    runs-on: "lab"
    needs:
      - plan
      - check
    permissions: *check-perms
    env:
      USER: "runner"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cpu: "powerpc64" # ideal for testing concurrency due to very weak memory model (and is big endian)
          # Disabled to save time in CI.  Enable if you are debugging memory issues and wish to bisect
          # why something might pass on one CPU model but fail on another.
          # Otherwise there is little benefit to enabling these CPUs in spite of their objectively more important
          # support story.  They just don't really stress test endianness or memory model issues, and they don't
          # meaningfully improve borrow check violation detection either.
          # - cpu: "aarch64"
          # - cpu: "x86_64"
          # - cpu: "s390x" # this is miri's big endian CPU of choice, but it has a stronger memory model than powerpc64
    steps:
      - *checkout
      - *nix-setup
      - name: "all packages"
        uses: *just
        env:
          # Miri bypasses `nix build`, so cap it through its own module.
          JUST_VARS: >-
            miri::cores=8
            miri::cpu=${{ matrix.cpu }}
        with:
          recipe: "miri::test"
      # The quiescent code is especially sensitive to concurrency violations
      # and memory-model issues so we run it again with and without strict
      # provenance enabled and on many different random schedules.  The
      # permissive-provenance build runs with real arc-swap and could
      # therefore catch issues which the strict run can't.  We run under
      # extra schedules to make that effect stand out as much as possible
      # (shuttle/loom can't test with arc-swap in place either, so this is
      # the closest we can get to fixing that coverage gap).
      - name: "concurrency/permissive"
        uses: *just
        env:
          JUST_VARS: >-
            miri::cores=8
            miri::seeds=8
            miri::cpu=${{ matrix.cpu }}
            miri::provenance=permissive
        with:
          recipe: "miri::test"
          recipe_args: "--package=dataplane-concurrency"
      - name: "concurrency/strict"
        uses: *just
        env:
          JUST_VARS: >-
            miri::cores=8
            miri::cpu=${{ matrix.cpu }}
            miri::provenance=strict
        with:
          recipe: "miri::test"
          recipe_args: "--package=dataplane-concurrency --features=_strict_provenance"
      - *tmate

  wasm:
    if: "${{ needs.plan.outputs.wasm == 'true' }}"
    name: "wasm32-wasip1"
    runs-on: "lab"
    needs:
      - plan
      - check
    permissions: *check-perms
    env: *ci-env
    steps:
      - *checkout
      - *nix-setup
      - name: "check"
        uses: *just
        with:
          recipe: "ci::wasm"
      - *tmate

  cross:
    if: "${{ needs.plan.outputs.cross == 'true' }}"
    name: "cross/${{ matrix.target }}/${{ matrix.platform }}/${{ matrix.libc }}"
    runs-on: "lab"
    needs:
      - plan
      - check
      - wasm
    permissions: *check-perms
    env:
      USER: "runner"
      JUST_VARS: ""
    strategy:
      fail-fast: false
      # Keep cross serial so one pull request cannot occupy the lab.
      max-parallel: 1
      matrix:
        platform:
          - "aarch64"
          - "bluefield3"
        libc:
          - "gnu"
          - "musl"
        target:
          - "dataplane"
          - "frr.dataplane"
    steps:
      - *checkout
      - *nix-setup
      # Emulate the two aarch64 musl dataplane builds before merge.
      - name: "test"
        if: >-
          ${{
            needs.plan.outputs.cross_full == 'true'
            && matrix.target == 'dataplane'
            && matrix.libc == 'musl'
          }}
        uses: *just
        with:
          recipe: "ci::cross-test"
          recipe_args: "${{ matrix.platform }} ${{ matrix.libc }}"
      - name: "build-container"
        uses: *just
        with:
          recipe: "ci::cross"
          recipe_args: "${{ matrix.platform }} ${{ matrix.libc }} build-container ${{ matrix.target }}"
      - *tmate

  concurrency:
    if: "${{ needs.plan.outputs.concurrency == 'true' }}"
    name: "concurrency"
    runs-on: "lab"
    needs:
      - plan
      - check
    permissions: *check-perms
    env: *ci-env
    steps:
      - *checkout
      - *nix-setup
      - name: "shuttle"
        uses: *just
        with:
          recipe: "ci::shuttle"
      - name: "loom"
        uses: *just
        with:
          recipe: "ci::loom"
      - *tmate

  vlab:
    needs:
      - version
      - build
      - plan

    name: "${{ matrix.hybrid && 'h' || 'v' }}-${{ matrix.upgradefrom && 'up' || '' }}${{ matrix.upgradefrom }}${{ matrix.upgradefrom && '-' || '' }}${{ matrix.mesh && 'mesh-' || '' }}${{ matrix.gateway && 'gw-' || '' }}${{ matrix.includeonie && 'onie-' || '' }}${{ matrix.buildmode }}-${{ matrix.vpcmode }}"

    uses: githedgehog/fabricator/.github/workflows/run-vlab.yaml@master
    with:
      # ci:+hlab is required to enable hybrid lab tests on PR
      # ci:+vlab is required to enable virtual lab tests on PR
      # ci:-vlab opts back out, including for ci:+merge-ready
      # ci:-upgrade disables upgrade tests on PR
      # hlab is disabled for main and merge_queue till we have gateway tests for it
      # ci:+merge-ready mirrors the merge queue, which skips HLAB.
      skip: >-
        ${{
          github.event_name == 'pull_request'
          && (
            contains(github.event.pull_request.labels.*.name, 'ci:-vlab')
            || matrix.hybrid && !contains(github.event.pull_request.labels.*.name, 'ci:+hlab')
            || !matrix.hybrid
               && !contains(github.event.pull_request.labels.*.name, 'ci:+vlab')
               && !contains(github.event.pull_request.labels.*.name, 'ci:+merge-ready')
            || matrix.upgradefrom != ''
               && contains(github.event.pull_request.labels.*.name, 'ci:-upgrade')
               && !contains(github.event.pull_request.labels.*.name, 'ci:+merge-ready')
          )

          || github.event_name == 'workflow_dispatch'
          && (
            matrix.hybrid && inputs.run_hlab_tests != true
            || !matrix.hybrid && inputs.skip_vlab_tests == true
          )

          || (github.event_name == 'push' || github.event_name == 'merge_group')
          && matrix.hybrid
        }}
      fabricatorref: master
      prebuild: |
        just bump dataplane ${{ needs.version.outputs.version }}-release
        just bump frr ${{ needs.version.outputs.version }}-release
      fabricmode: ${{ matrix.fabricmode }}
      gateway: ${{ matrix.gateway }}
      includeonie: ${{ matrix.includeonie }}
      buildmode: ${{ matrix.buildmode }}
      vpcmode: ${{ matrix.vpcmode }}
      releasetest: ${{ contains(github.event.pull_request.labels.*.name, 'ci:+release') || inputs.enable_release_tests == true }}
      hybrid: ${{ matrix.hybrid }}
      upgradefrom: ${{ matrix.upgradefrom }}

    strategy:
      fail-fast: false
      matrix:
        fabricmode:
          - spine-leaf
        gateway:
          - true
        includeonie:
          - false
        buildmode:
          - iso
        vpcmode:
          - l2vni
        hybrid:
          - false
        upgradefrom:
          - ""
          - "26.03"
        include:
          # gateway l3vni
          - fabricmode: spine-leaf
            gateway: true
            includeonie: false
            buildmode: iso
            vpcmode: l3vni
            hybrid: false
            upgradefrom: ""

          # hlab gateway l2vni
          - fabricmode: spine-leaf
            gateway: true
            includeonie: false
            buildmode: iso
            vpcmode: l2vni
            hybrid: true
            upgradefrom: ""

  summary:
    name: "Summary"
    runs-on: "ubuntu-latest"
    needs:
      - build
      - check
      - concurrency
      - coverage
      - cross
      - lint
      - miri
      # Include prerequisites so dependent skips cannot hide their failures.
      - plan
      - sanitize
      - test_each
      - version
      - vlab
      - wasm
    # Aggregate failures while allowing phased jobs to be skipped.
    if: ${{ always() }}
    steps:
      - name: "Flag any job failures"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' <<<"${NEEDS}")"
          status=0
          for job in ${failed}; do
            echo "::error::${job} did not succeed"
            status=1
          done
          exit "${status}"

  publish:
    name: "Publish release artifacts"
    runs-on: lab
    if: startsWith(github.event.ref, 'refs/tags/v') && github.event_name == 'push'
    # Gate releases on the aggregate result so every deep check remains blocking.
    needs:
      - summary

    permissions:
      packages: write # docker/login-action + `just push` publish images to ghcr.io
      contents: read

    env:
      USER: "runner"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # used to run go fmt after patching dp/frr versions in the fabricator
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: "./.github/actions/nix-shell"
        with:
          cachix_signing_key: "${{ secrets.CACHIX_SIGNING_KEY }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "push containers"
        env:
          ref_name: ${{ github.ref_name }}
        run: |
          set -euo pipefail;
          just \
            jobs=1 \
            cores=8 \
            docker_sock=/run/docker/docker.sock \
            oci_repo=ghcr.io \
            version="${ref_name}" \
            push

      # Bump dataplane in the fabricator repository

      - name: Checkout fabricator repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: githedgehog/fabricator
          path: fab-repo
          persist-credentials: false

      - name: Bump dataplane+frr in fabricator
        working-directory: fab-repo
        env:
          ref_name: ${{ github.ref_name }}
        run: |
          set -euo pipefail;
          sed -i "s/^\tDataplaneVersion.*/\tDataplaneVersion=meta.Version(\"${ref_name}\")/" pkg/fab/versions.go
          sed -i "s/^\tFRRVersion.*/\tFRRVersion=meta.Version(\"${ref_name}\")/" pkg/fab/versions.go
          go fmt pkg/fab/versions.go

      - name: Generate token for the fabricator repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: fab-app-token
        with:
          client-id: ${{ secrets.FAB_APP_ID }}
          private-key: ${{ secrets.FAB_PRIVATE_KEY }}
          repositories: |
            fabricator
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request for fabricator
        # zizmor: ignore[superfluous-actions] -- relies on this action's diff-detection
        # and sign-commits behavior; not worth reimplementing over `gh pr create`.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: fab-pr
        with:
          token: ${{ steps.fab-app-token.outputs.token }}
          path: fab-repo
          branch: pr/auto/dataplane-bump
          commit-message: |
            bump: dataplane/frr to ${{ github.ref_name }}

            This is an automated commit created by GitHub Actions workflow,
            in the dataplane repository.
          signoff: true
          title: "bump: dataplane/frr to ${{ github.ref_name }}"
          body: |
            This is an automated Pull Request created by GitHub Actions workflow,
            in the dataplane repository.
          labels: |
            ci:+release
            ci:+hlab
