[package]
name = "dataplane-vni-limit"
description = "Rate limit VXLAN traffic per VNI (and inner destination) in an mlx5 NIC, in front of the kernel driver"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "vni-limit"
path = "src/main.rs"

[dependencies]
# internal
clock = { workspace = true }
concurrency = { workspace = true }
dpdk = { workspace = true, features = [] }
net = { workspace = true, features = [] }

# external
chrono = { workspace = true, features = ["alloc", "std"] }
clap = { workspace = true, features = ["derive", "std", "help", "usage"] }
ipnet = { workspace = true, features = ["serde", "std"] }
nix = { workspace = true, features = ["net", "signal"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_yaml_ng = { workspace = true, features = [] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
