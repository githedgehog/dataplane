[package]
name = "dataplane-tracectl"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
evidence = []
# `evidence.rs` gates its tests on these, and a feature nothing declares is a
# gate that never closes: without them the tests ran under shuttle and loom
# anyway, and `-D unexpected-cfgs` in the nix build is what says so.
loom = ["concurrency/loom"]
shuttle = ["concurrency/shuttle"]

[dependencies]
clock = { workspace = true }
color-eyre = { workspace = true , features = [ "capture-spantrace", "color-spantrace", "tracing-error", "track-caller" ] }
common = { workspace = true }
concurrency = { workspace = true }
linkme = { workspace = true }
ordermap = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-error = { workspace = true, features = ["traced-error"] }
tracing-subscriber = { workspace = true, features = ["registry", "std", "env-filter", "fmt"] }

[dev-dependencies]
clock = { workspace = true, features = ["virtual"] }
serial_test = { workspace = true }
tracing-test = { workspace = true }
