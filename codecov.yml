comment:
  # Show each cargo profile separately.
  layout: "condensed_header, flags, condensed_files, condensed_footer"
  behavior: default
  require_changes: false

# Fuzz runs only on deep or explicitly labeled runs.
flags:
  debug:
    carryforward: false
  fuzz:
    carryforward: true
coverage:
  status:
    project:
      default:
        # Coverage is informational until the project defines a target.
        informational: true
    patch:
      default:
        informational: true
