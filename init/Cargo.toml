[package]
name = "dataplane-init"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = ["sysroot"]
sysroot = ["dep:dpdk-sysroot-helper"]

[dependencies]
# internal
args = { workspace = true }
clock = { workspace = true }
hardware = { workspace = true, features = ["serde", "scan"] }
id = { workspace = true }
sysfs = { workspace = true }

# external
command-fds = { workspace = true }
# Devlink reload moves both the netdev and RDMA device.
devlink = { workspace = true }
futures = { workspace = true }
nix = { workspace = true, features = ["mount", "fs", "process", "signal", "user"] }
procfs = { workspace = true, features = [] }
rtnetlink = { workspace = true, features = ["default", "tokio"] }
strum = { workspace = true, features = ["derive"] }
strum_macros = { workspace = true, features = [] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
# internal
n-vm = { workspace = true }
test-utils = { workspace = true }

# external
caps = { workspace = true }
fixin = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["inotify", "mount", "net", "sched", "signal"] }

[build-dependencies]
# internal
dpdk-sysroot-helper = { workspace = true, optional = true }

# external
