[server]
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false

[auth.anonymous]
# A lab with no ingress and nothing secret in it. A login prompt here costs a step every time
# someone wants to look at a graph and buys nothing.
enabled = true
org_role = Admin

[auth]
disable_login_form = true

[log]
level = warn
