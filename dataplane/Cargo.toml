[package]
name = "dataplane"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# Bin is gated out under loom (see `src/main.rs`); the feature exists so
# `--features loom` resolves at workspace level and propagates to libs.
loom = ["concurrency/loom"]
shuttle = ["concurrency/shuttle", "nat/shuttle", "flow-entry/shuttle"]
shuttle_dfs = ["concurrency/shuttle_dfs", "shuttle"]

[dependencies]
acl-filter = { workspace = true }
afpacket = { workspace = true, features = ["async-tokio"] }
args = { workspace = true }
arrayvec = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
axum-server = { workspace = true }
clock = { workspace = true }
common = { workspace = true }
concurrency = { workspace = true }
config = { workspace = true }
dpdk = { workspace = true }
dyn-iter = { workspace = true }
# `Dev::stats` reports a `dpdk::…::ErrorCode` from this crate, and the DPDK driver polls
# those counters, so it has to be able to name what a failed read returns.
errno = { workspace = true }
flow-entry = { workspace = true }
flow-filter = { workspace = true }
futures = { workspace = true }
# Shares the PCI address type with `dataplane-init`, which is what binds these
# devices for DPDK in the first place: one parser, one notion of equality.
hardware = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
id = { workspace = true }
interface-manager = { workspace = true }
lifecycle = { workspace = true }
linkme = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
mgmt = { workspace = true }
nat = { workspace = true }
net = { workspace = true, features = ["test_buffer"] }
nix = { workspace = true, features = ["socket", "hostname", "net"] }
netdev = { workspace = true }
once_cell = { workspace = true }
ordermap = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
pipeline = { workspace = true }
pyroscope = { workspace = true, features = ["backend-pprof-rs"] }
routing = { workspace = true }
rtnetlink = { workspace = true, features = ["default", "tokio"] }
serde = { workspace = true, features = ["derive"] }
stats = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
tracectl = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true }
vpcmap = { workspace = true }

[dev-dependencies]
clock = { workspace = true, features = ["virtual"] }
# internal
config = { workspace = true, features = ["bolero"] }
lpm = { workspace = true, features = ["testing"] }
net = { workspace = true, features = ["bolero", "builder", "test_buffer", "test_meta"] }
routing = { workspace = true, features = ["testing"] }
# Only in tests: `DoneReason::COUNT` is what makes the punt policy table fail when a
# verdict is added without a decision about what the control plane should see.
strum = { workspace = true }

test-utils = { workspace = true }

# external
bolero = { workspace = true, default-features = false, features = ["alloc"] }
caps = { workspace = true, default-features = false, features = [] }
fixin = { workspace = true }
n-vm = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tracectl = { workspace = true, features = ["evidence"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = [] }

[target.'cfg(not(miri))'.dev-dependencies]
dpdk = { workspace = true, features = ["test"] }
