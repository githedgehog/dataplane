[package]
name = "dataplane-flowgen"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# Drive DPDK queues. Without it, the crate builds frames and accounts for them and nothing else.
dpdk = ["dep:dpdk", "dep:net"]

[dependencies]
clock = { workspace = true }
dpdk = { workspace = true, optional = true }
flowgen-report = { workspace = true }
net = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
net = { workspace = true, features = ["test_buffer"] }
