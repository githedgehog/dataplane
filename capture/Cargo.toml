[package]
name = "dataplane-capture"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
loom = ["concurrency/loom"]
shuttle = ["concurrency/shuttle"]
shuttle_dfs = ["concurrency/shuttle_dfs", "shuttle"]

[dependencies]
arrayvec = { workspace = true }
clock = { workspace = true }
concurrency = { workspace = true }
net = { workspace = true }
pcap-file = { workspace = true }
pipeline = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
net = { workspace = true, features = ["bolero", "test_buffer"] }
strum = { workspace = true }
