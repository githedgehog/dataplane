# 
# RFC1122                  TRANSPORT LAYER -- UDP             October 1989
# 
#  - Applic layer can specify Local IP addr        |4.1.3.5 |x| | | | |
#  - Applic layer specify wild Local IP addr       |4.1.3.5 |x| | | | |
#  - Applic layer notified of Local IP addr used   |4.1.3.5 | |x| | | |
