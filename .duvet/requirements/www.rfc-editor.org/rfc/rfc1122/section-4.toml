#                                                  |        |M|O| |D|T|n
#                                                  |        |U|U|M| | |o
#                                                  |        |S|L|A|N|N|t
#                                                  |        |T|D|Y|O|O|t
# FEATURE                                          |SECTION | | | |T|T|e
# -------------------------------------------------|--------|-|-|-|-|-|--
#                                                  |        | | | | | |
#     UDP                                          |        | | | | | |
# -------------------------------------------------|--------|-|-|-|-|-|--
#                                                  |        | | | | | |
# UDP send Port Unreachable                        |4.1.3.1 | |x| | | |
#                                                  |        | | | | | |
# IP Options in UDP                                |        | | | | | |
#  - Pass rcv'd IP options to applic layer         |4.1.3.2 |x| | | | |
#  - Applic layer can specify IP options in Send   |4.1.3.2 |x| | | | |
