option enabling the external list to be provided.
'''

[[spec]]
level = "MUST"
quote = '''
An implementation
MUST NOT include in the external list routers that were learned
through the external list provided by a router in another autonomous
system.
'''

[[spec]]
level = "MUST"
quote = '''
An implementation MUST NOT send a network back to the
autonomous system from which it is learned, i.e.
'''

[[spec]]
