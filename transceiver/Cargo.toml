[package]
name = "dataplane-transceiver"
description = "Decode pluggable transceiver management memory (SFF-8472, SFF-8636, CMIS)"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# Read module memory through the kernel's ethtool netlink interface.
ethtool = ["dep:ethtool2"]

[dependencies]
ethtool2 = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "ethtool"
required-features = ["ethtool"]
