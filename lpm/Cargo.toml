[package]
name = "dataplane-lpm"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
bolero = ["dep:bolero"]
testing = []

[dependencies]
bnum = { workspace = true }
bolero = { workspace = true, optional = true }
ipnet = { workspace = true, features = ["serde"] }
match-action = { workspace = true }
num-traits = { workspace = true }
prefix-trie = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, default-features = false }
# Test-only: the RFC 3849 IPv6 documentation block lives in `net`.
# `net` does not depend on this crate, so this edge introduces no cycle.
net = { workspace = true }
serde_yaml_ng = { workspace = true }
