[package]
name = "dataplane-config"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# Generators for the configuration types, for property tests in this crate and downstream.
bolero = ["dep:bolero", "lpm/bolero"]

[dependencies]
# internal
clock = { workspace = true }
common = { workspace = true }
concurrency = { workspace = true }
k8s-intf = { workspace = true }
lpm = { workspace = true }
match-action = { workspace = true }
net = { workspace = true }

# external
arc-swap = { workspace = true }
bolero = { workspace = true, optional = true, default-features = false, features = ["alloc"] }
chrono = { workspace = true, features = ["alloc", "std"] }
derive_builder = { workspace = true, features = [] }
ipnet = { workspace = true }
multi_index_map = { workspace = true, features = ["serde"] }
ordermap = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }

[target.'cfg(unix)'.dependencies]
linkme = { workspace = true }
tracectl = { workspace = true }

[dev-dependencies]
clock = { workspace = true, features = ["virtual"] }
# internal
pipeline = { workspace = true } # should be removed w/ NAT
lpm = { workspace = true, features = ["bolero", "testing"] }
k8s-intf = { workspace = true, features = ["bolero"] }

# external
bolero = { workspace = true, features = ["alloc"] }
caps = { workspace = true }
ipnet = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }
